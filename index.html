<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Спаси Больного! — Скорая Помощь</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #070c18; }
    </style>
    <!-- Yandex Games SDK: loaded asynchronously, the game is notified via events.
         Relative path /sdk.js is the variant recommended for uploading to the Yandex server. -->
    <script>
      function initSDK() {
        // onload fired, but double-check the SDK object exists (docs: YaGames.init after script load)
        if (typeof YaGames === "undefined") {
          failSDK();
          return;
        }
        window.__YSDK_STATE__ = "loaded";
        window.dispatchEvent(new Event("ysdk-loaded"));
      }
      function failSDK() {
        window.__YSDK_STATE__ = "failed";
        window.dispatchEvent(new Event("ysdk-failed"));
      }
    </script>
    <!-- Yandex Games SDK -->
    <script async src="/sdk.js" onload="initSDK()" onerror="failSDK()"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
